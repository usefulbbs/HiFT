
exp_dir: exp/HiFT-155
gpus: "[0]"
num_avg: 10
enable_amp: False 

seed: 42
num_epochs: 150
save_epoch_interval: 10
log_batch_interval: 100

dataloader_args:
  batch_size: 32
  num_workers: 4
  pin_memory: True
  prefetch_factor: 2
  drop_last: True

dataset_args:
  sample_num_per_epoch: 0
  shuffle: True
  shuffle_args:
    shuffle_size: 2500
  filter: True
  filter_args:
    min_num_frames: 100
    max_num_frames: 800
  resample_rate: 16000
  speed_perturb: True
  num_frms: 200
  aug_prob: 0.6 
  fbank_args:
    num_mel_bins: 80
    frame_shift: 10
    frame_length: 25
    dither: 1.0
  spec_aug: True
  spec_aug_args:
    num_t_mask: 1
    num_f_mask: 1
    max_t: 20
    max_f: 10
    prob: 0.5

model: DFResNet155_FullHiFT
model_init: null
model_args:
  feat_dim: 80
  embed_dim: 256
  pooling_func: "TSTP" 
  two_emb_layer: False

projection_args:
  project_type: "arc_margin" 
  scale: 32.0
  easy_margin: False

margin_scheduler: MarginScheduler
margin_update:
  initial_margin: 0.0
  final_margin: 0.2
  increase_start_epoch: 20
  fix_start_epoch: 40
  update_margin: True
  increase_type: "exp"

loss: CrossEntropyLoss
loss_args: {}

optimizer: AdamW
optimizer_args:
  weight_decay: 0.05

scheduler: ExponentialDecrease
scheduler_args:
  initial_lr: 0.0015 
  final_lr: 0.00005
  warm_up_epoch: 6
  warm_from_zero: True